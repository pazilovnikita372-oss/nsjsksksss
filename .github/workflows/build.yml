name: Build OXIDE APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Находит папку проекта, даже если он лежит во вложенной папке репозитория
      - name: Locate Android project
        run: |
          SETTINGS=$(find . -name 'settings.gradle*' -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::В репозитории нет settings.gradle.kts. Загрузите в репозиторий ВСЕ файлы проекта (app/, gradle/, build.gradle.kts, settings.gradle.kts), а не только .github."
            find . -not -path './.git/*' -maxdepth 2
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OXIDE-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
